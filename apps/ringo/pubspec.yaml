name: ringo
description: Ringo Flutter application
publish_to: none
resolution: workspace

version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.5'

dependencies:
  app_shell:
    path: ../../features/app_shell
  dashboard:
    path: ../../features/dashboard
  flutter:
    sdk: flutter
  go_router: ^16.3.0
  onboarding:
    path: ../../features/onboarding
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  ring_transport:
    path: ../../packages/ring_transport
  sleep:
    path: ../../features/sleep
  storage_tostore:
    path: ../../packages/storage_tostore
  ui_kit:
    path: ../../packages/ui_kit

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
